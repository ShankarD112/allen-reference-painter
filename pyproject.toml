[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allen-reference-painter"
version = "0.1.0"
description = "Python desktop app for painting Allen Mouse atlas mesh ROIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
    "matplotlib",
    "trimesh",
    "pyvista",
    "pyvistaqt",
    "qtpy",
    "PySide6",
    "vtk",
    "brainglobe-atlasapi",
]

[project.scripts]
allen-reference-painter = "allen_reference_painter.app:main"

[tool.setuptools.packages.find]
where = ["src"]
