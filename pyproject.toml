[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allen-reference-painter"
version = "0.3.0"
description = "Python desktop app for painting Allen Mouse atlas mesh ROIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "xlrd",
    "pillow",
    "pandas",
    "openpyxl",
    "matplotlib",
    "trimesh",
    "pyvista",
    "pyvistaqt",
    "qtpy",
    "PySide6",
    "vtk",
    "brainglobe-atlasapi",
]

[project.scripts]
allen-reference-painter = "allen_reference_painter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
