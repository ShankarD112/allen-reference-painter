name: Browser app validation
on:
  push:
    branches: [main, 'feat/browser-*']
    paths: ['web/**', 'public/**', 'scripts/*web*', 'requirements-web.txt', 'index.html', 'package*.json', 'vite.config.js', 'playwright.config.js', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'public/**', 'scripts/*web*', 'requirements-web.txt', 'index.html', 'package*.json', 'vite.config.js', 'playwright.config.js', '.github/workflows/web.yml']
  workflow_dispatch:
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run atlas:prepare
      - run: npm run test:web
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
