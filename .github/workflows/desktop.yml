name: Desktop validation and Windows build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_API: pyside6
      ALLEN_PAINTER_DATA_DIR: ${{ github.workspace }}/test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/benchmark_brush.py
      - name: Linux display libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxcb-cursor0 libxkbcommon-x11-0
      - name: Linux GUI smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m allen_reference_painter.main --self-test --self-test-output smoke-output
      - name: Windows GUI smoke
        if: runner.os == 'Windows'
        run: python -m allen_reference_painter.main --self-test --self-test-output smoke-output
      - name: Record resolved dependencies
        if: always()
        run: python -m pip freeze > resolved-dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ runner.os }}
          path: |
            smoke-output/
            test-data/logs/
            resolved-dependencies.txt
  windows-executable:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_API: pyside6
      ALLEN_PAINTER_DATA_DIR: ${{ github.workspace }}/package-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m PyInstaller --noconfirm packaging/AllenReferencePainter.spec
      - name: Test the actual executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/AllenReferencePainter/AllenReferencePainter.exe -ArgumentList '--self-test --self-test-output frozen-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable smoke failed with exit $($process.ExitCode)" }
          if (!(Test-Path frozen-smoke/smoke-result.json)) { throw 'Missing executable smoke result' }
      - name: Record packaged dependencies and hashes
        shell: pwsh
        run: |
          python -m pip freeze > dist/AllenReferencePainter/resolved-dependencies.txt
          Get-ChildItem dist/AllenReferencePainter -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 500 | Set-Content dist/AllenReferencePainter/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AllenReferencePainter-Windows-x64
          path: dist/AllenReferencePainter/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-smoke-diagnostics
          path: |
            frozen-smoke/
            package-test-data/logs/
            build/AllenReferencePainter/warn-AllenReferencePainter.txt
